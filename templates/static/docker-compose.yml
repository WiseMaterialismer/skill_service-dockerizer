services:
  web:
    container_name: ${APP_NAME:-frontend-service}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      # 如果本地已构建出 dist，想直接调试改代码，可直接挂载 dist
      # - ./dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
